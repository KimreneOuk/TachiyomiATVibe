android.nonTransitiveRClass=false
android.useAndroidX=true

kotlin.code.style=official
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2

org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Configuration cache is blocked: app/build.gradle.kts runs `git rev-list/rev-parse`
# during configuration, and the ru.solodovnikov.shortcuthelper task reads Task.project
# at execution time. Gradle discards the cache entry on both, so enabling this only
# fails builds. Revisit after those are fixed.
# org.gradle.configuration-cache=true
