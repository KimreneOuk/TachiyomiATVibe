name: 🐞 Issue report
description: Report an issue in TachiyomiATVibe
labels: [Bug]
body:
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Provide clear steps that let someone reproduce the issue.
      placeholder: |
        Example:
          1. Open a chapter
          2. Start a translation
          3. Describe what happens
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what happened instead.
    validations:
      required: true

  - type: dropdown
    id: translation-mode
    attributes:
      label: Translation mode
      description: If this issue involves translation, select the mode you were using.
      options:
        - Not applicable
        - Manual
        - Auto
        - Batch

  - type: dropdown
    id: translator-provider
    attributes:
      label: Translator provider
      description: If this issue involves translation, select the configured provider.
      options:
        - Not applicable
        - ML Kit
        - Google Translate
        - DeepL
        - Gemini
        - OpenRouter
        - DeepSeek
        - LM Studio
        - Other or unknown

  - type: input
    id: ocr-backend
    attributes:
      label: OCR backend
      description: If applicable, identify the selected OCR backend; write “unknown” if unsure.

  - type: input
    id: build-information
    attributes:
      label: TachiyomiATVibe build
      description: There are no public releases yet. Include the source commit/build date, or the CI run date and commit SHA.
      placeholder: "Source build: commit SHA and date, or CI run: YYYY-MM-DD and commit SHA"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: You can find this in your Android settings.
      placeholder: "Example: Android 14"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Include the device manufacturer and model.
      placeholder: "Example: Google Pixel 8"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste relevant logs or attach crash logs if available. Before posting, redact API keys, access tokens, and other credentials.
      placeholder: Paste relevant logs here.

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      description: Add any context or attachments that may help reproduce the issue.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched the repository's existing issues for duplicates.
          required: true
        - label: I have included my build information and reproduction steps above.
          required: true
        - label: I have redacted API keys and other credentials from any logs or attachments.
          required: true
