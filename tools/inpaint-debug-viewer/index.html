<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inpaint Debug Viewer</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <h1>Inpaint Debug Viewer</h1>
        <p id="imageMeta">No image loaded</p>
      </div>
    </div>
    <label class="file-button">
      <input id="fileInput" type="file" accept="image/*">
      Upload image
    </label>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="controls">
        <h2>Detection Settings</h2>
        <div class="button-row">
          <button id="addBoxBtn" type="button">Draw box</button>
          <button id="clearBoxesBtn" type="button">Clear</button>
        </div>
        <div class="button-row" style="margin-top: 8px;">
          <button id="detectBtn" type="button">1. Detect</button>
          <button id="ocrBtn" type="button">2. OCR</button>
          <button id="inpaintBtn" type="button">3. Inpaint</button>
          <button id="translateBtn" type="button">4. Translate</button>
        </div>
        <div class="button-row" style="margin-top: 8px;">
          <button id="runAllBtn" type="button" style="width: 100%; background: var(--accent); color: var(--bg);">Run Entire Pipeline</button>
        </div>
        <p id="drawHint" class="hint">Click Draw box, then drag on the Bounding Box image.</p>
        <div id="boxList" class="box-list"></div>
        <label>
          Crop pad
          <input id="paddleCropPadInput" type="range" min="0" max="48" value="12">
          <output id="paddleCropPadOut">12</output>
        </label>
        <label>
          Pixel threshold
          <input id="paddleThreshInput" type="range" min="5" max="35" value="18">
          <output id="paddleThreshOut">0.18</output>
        </label>
        <label>
          Box threshold
          <input id="paddleBoxThreshInput" type="range" min="15" max="55" value="34">
          <output id="paddleBoxThreshOut">0.34</output>
        </label>
        <label>
          Rec confidence
          <input id="recConfidenceInput" type="range" min="0" max="95" value="50">
          <output id="recConfidenceOut">0.50</output>
        </label>
      </section>

      <section class="controls">
        <h2>Goal-Driven Crop Settings</h2>
        <label>
          Inpainting Mode
          <select id="modeSelect">
            <option value="quality" selected>QUALITY</option>
            <option value="fast">FAST</option>
          </select>
        </label>
        <label>
          Algorithm
          <select id="algoSelect">
            <option value="legacy" selected>LEGACY</option>
            <option value="coherent">COHERENT</option>
          </select>
        </label>
        <label style="display: flex; align-items: center; gap: 8px;">
          <input id="tinyExpandInput" type="checkbox" checked>
          <span>Tiny-box expand</span>
        </label>
        <label>
          Poisson iters
          <input id="poissonItersInput" type="range" min="50" max="800" step="50" value="300">
          <output id="poissonItersOut">300</output>
        </label>
        <label>
          Low-res scale
          <input id="scaleInput" type="range" min="5" max="25" value="10">
          <output id="scaleOut">10%</output>
        </label>
        <label>
          Smooth passes
          <input id="passesInput" type="range" min="4" max="80" value="36">
          <output id="passesOut">36</output>
        </label>
        <label>
          Gray-Fill Std Threshold
          <input id="grayFillThreshInput" type="range" min="0" max="20" step="0.5" value="3.0">
          <output id="grayFillThreshOut">3.0</output>
        </label>
      </section>

      <section class="controls">
        <h2>Native Blending Parameters</h2>
        <label>
          Box pad
          <input id="padInput" type="range" min="0" max="24" value="8">
          <output id="padOut">8</output>
        </label>
        <label>
          Feather
          <input id="featherInput" type="range" min="0" max="24" value="8">
          <output id="featherOut">8</output>
        </label>
        <button id="downloadBtn" type="button">Download inpainted</button>
      </section>

      <section class="controls">
        <h2>Translation Settings</h2>
        <label>
          LM Studio Base URL
          <div style="display: flex; gap: 8px;">
            <input id="lmUrlInput" type="text" value="http://192.168.100.7:3456/v1" style="flex: 1;">
            <button id="fetchModelsBtn" type="button" style="padding: 2px 8px;">Fetch</button>
          </div>
        </label>
        <label>
          Model Name
          <select id="lmModelSelect">
            <option value="local-model">local-model</option>
          </select>
        </label>
        <label>
          Max Output Tokens
          <input id="maxTokensInput" type="number" value="8192" min="256" max="32768" step="256">
        </label>
      </section>
        <div class="translation-results-wrapper" style="margin-top: 24px; border-top: 1px solid var(--panel-border); padding-top: 24px;">
          <h2>OCR & Translation Results</h2>
          <div id="translationResults" class="translation-results">
            <p class="hint">No translation data yet.</p>
          </div>
        </div>
      </section>
    </aside>

    <section class="viewer-stage">
      <div class="canvas-toggles" id="canvasToggles">
        <label>
          <input type="radio" name="layer" value="original" checked>
          <span>Original</span>
        </label>
        <label>
          <input type="radio" name="layer" value="box">
          <span>Bounding Box</span>
        </label>
        <label>
          <input type="radio" name="layer" value="mask">
          <span>Mask Only</span>
        </label>
        <label>
          <input type="radio" name="layer" value="inpaint">
          <span>Inpainted</span>
        </label>
        <label>
          <input type="radio" name="layer" value="rendered">
          <span>Translated</span>
        </label>
      </div>

      <div class="canvas-container" id="canvasContainer">
        <div class="canvas-stack" id="canvasStack">
          <canvas id="originalCanvas" class="active"></canvas>
          <canvas id="boxCanvas"></canvas>
          <canvas id="maskCanvas"></canvas>
          <canvas id="inpaintCanvas"></canvas>
          <canvas id="renderedCanvas"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js?v=3"></script>
</body>
</html>
